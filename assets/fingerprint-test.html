<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fingerprint Test</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    body {
      margin: 0;
      padding: 24px;
      background: Canvas;
      color: CanvasText;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .muted {
      color: color-mix(in srgb, CanvasText 68%, Canvas);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0;
    }
    button {
      padding: 8px 12px;
      border: 1px solid color-mix(in srgb, CanvasText 22%, Canvas);
      border-radius: 6px;
      background: ButtonFace;
      color: ButtonText;
      cursor: pointer;
    }
    button.secondary {
      background: Canvas;
      color: CanvasText;
    }
    section {
      border-top: 1px solid color-mix(in srgb, CanvasText 16%, Canvas);
      padding: 18px 0;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .box {
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas);
      border-radius: 8px;
      padding: 12px;
      overflow-wrap: anywhere;
    }
    .label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: color-mix(in srgb, CanvasText 62%, Canvas);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border-top: 1px solid color-mix(in srgb, CanvasText 12%, Canvas);
      padding: 8px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th {
      width: 220px;
      font-weight: 600;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 12px;
      border-radius: 8px;
      background: color-mix(in srgb, CanvasText 8%, Canvas);
    }
    .panel {
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas);
      border-radius: 8px;
      padding: 14px;
      margin-top: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    label {
      display: grid;
      gap: 4px;
      font-size: 13px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas);
      border-radius: 6px;
      background: Canvas;
      color: CanvasText;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Fingerprint Test</h1>
    <p class="muted">本页只在本地读取浏览器暴露的环境信号，用于测试电脑、浏览器 Profile 和系统环境差异。它不会上传数据，也不会伪造指纹。</p>
    <div class="toolbar">
      <button id="refresh">重新检测</button>
      <button id="copy">复制 JSON</button>
      <button id="download">下载报告</button>
      <button id="toggle-sim" class="secondary">打开模拟面板</button>
    </div>
    <div class="summary">
      <div class="box"><span class="label">摘要哈希</span><strong id="hash">检测中...</strong></div>
      <div class="box"><span class="label">浏览器</span><span id="browser">检测中...</span></div>
      <div class="box"><span class="label">系统语言 / 时区</span><span id="locale">检测中...</span></div>
      <div class="box"><span class="label">屏幕</span><span id="screen">检测中...</span></div>
    </div>

    <section id="simulation" class="hidden">
      <h2>本地模拟参数</h2>
      <p class="muted">这些输入只会改下面的“模拟报告”和模拟摘要哈希，不会改变浏览器本身，也不会影响真实网站看到的指纹。</p>
      <div class="toolbar">
        <button id="apply-sim">应用模拟</button>
        <button id="reset-sim" class="secondary">恢复真实检测值</button>
        <button id="preset-win" class="secondary">示例 Windows</button>
        <button id="preset-mac" class="secondary">示例 macOS</button>
      </div>
      <div class="panel">
        <div class="grid">
          <label>User-Agent <input id="sim-ua"></label>
          <label>Platform <input id="sim-platform"></label>
          <label>Language <input id="sim-language"></label>
          <label>Timezone <input id="sim-timezone"></label>
          <label>Screen width <input id="sim-width" type="number" min="1"></label>
          <label>Screen height <input id="sim-height" type="number" min="1"></label>
          <label>Device pixel ratio <input id="sim-dpr" type="number" min="0.1" step="0.1"></label>
          <label>CPU threads <input id="sim-cpu" type="number" min="1"></label>
          <label>Device memory GB <input id="sim-memory" type="number" min="0" step="0.5"></label>
          <label>Touch points <input id="sim-touch" type="number" min="0"></label>
          <label>WebGL vendor <input id="sim-webgl-vendor"></label>
          <label>WebGL renderer <input id="sim-webgl-renderer"></label>
        </div>
      </div>
    </section>

    <section>
      <h2>信号明细</h2>
      <table id="signals"></table>
    </section>

    <section>
      <h2>JSON 报告</h2>
      <pre id="json">检测中...</pre>
    </section>
  </main>

  <script>
    const textEncoder = new TextEncoder();
    let currentReport = {};
    let actualReport = {};

    async function sha256(value) {
      const data = textEncoder.encode(value);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(digest)).map(x => x.toString(16).padStart(2, "0")).join("");
    }

    async function canvasSignal() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 360;
        canvas.height = 90;
        const ctx = canvas.getContext("2d");
        ctx.textBaseline = "top";
        ctx.fillStyle = "#f4f6fb";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#204b7a";
        ctx.font = "16px Arial";
        ctx.fillText("Clean Browser Env 指纹测试 12345", 12, 16);
        ctx.fillStyle = "rgba(180, 70, 40, 0.65)";
        ctx.arc(280, 42, 24, 0, Math.PI * 2);
        ctx.fill();
        return await sha256(canvas.toDataURL());
      } catch (error) {
        return `error: ${error.message}`;
      }
    }

    function webglSignal() {
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) return { supported: false };
        const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        return {
          supported: true,
          vendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
          renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
          version: gl.getParameter(gl.VERSION),
          shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
          maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE)
        };
      } catch (error) {
        return { supported: false, error: error.message };
      }
    }

    async function audioSignal() {
      try {
        const AudioContext = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!AudioContext) return "unsupported";
        const context = new AudioContext(1, 44100, 44100);
        const oscillator = context.createOscillator();
        const compressor = context.createDynamicsCompressor();
        oscillator.type = "triangle";
        oscillator.frequency.value = 10000;
        compressor.threshold.value = -50;
        compressor.knee.value = 40;
        compressor.ratio.value = 12;
        compressor.attack.value = 0;
        compressor.release.value = 0.25;
        oscillator.connect(compressor);
        compressor.connect(context.destination);
        oscillator.start(0);
        const buffer = await context.startRendering();
        const sample = Array.from(buffer.getChannelData(0).slice(0, 120)).map(n => n.toFixed(6)).join(",");
        return await sha256(sample);
      } catch (error) {
        return `error: ${error.message}`;
      }
    }

    function storageSignal() {
      const result = {};
      for (const name of ["localStorage", "sessionStorage", "indexedDB"]) {
        try {
          result[name] = Boolean(window[name]);
        } catch {
          result[name] = false;
        }
      }
      result.cookieEnabled = navigator.cookieEnabled;
      return result;
    }

    async function collectReport() {
      const nav = navigator;
      const intl = Intl.DateTimeFormat().resolvedOptions();
      const report = {
        generatedAt: new Date().toISOString(),
        browser: {
          userAgent: nav.userAgent,
          appVersion: nav.appVersion,
          platform: nav.platform,
          vendor: nav.vendor,
          product: nav.product,
          webdriver: nav.webdriver === true
        },
        locale: {
          language: nav.language,
          languages: Array.from(nav.languages || []),
          timezone: intl.timeZone,
          calendar: intl.calendar,
          numberingSystem: intl.numberingSystem
        },
        screen: {
          width: screen.width,
          height: screen.height,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight,
          colorDepth: screen.colorDepth,
          pixelDepth: screen.pixelDepth,
          devicePixelRatio: window.devicePixelRatio
        },
        hardware: {
          hardwareConcurrency: nav.hardwareConcurrency || null,
          deviceMemory: nav.deviceMemory || null,
          maxTouchPoints: nav.maxTouchPoints || 0
        },
        storage: storageSignal(),
        permissionsApi: Boolean(nav.permissions),
        connection: nav.connection ? {
          effectiveType: nav.connection.effectiveType,
          downlink: nav.connection.downlink,
          rtt: nav.connection.rtt,
          saveData: nav.connection.saveData
        } : null,
        canvasHash: await canvasSignal(),
        audioHash: await audioSignal(),
        webgl: webglSignal()
      };
      report.summaryHash = await sha256(JSON.stringify(report));
      return report;
    }

    function cloneReport(report) {
      return JSON.parse(JSON.stringify(report));
    }

    function field(id) {
      return document.getElementById(id);
    }

    function setSimulationInputs(report) {
      field("sim-ua").value = report.browser.userAgent || "";
      field("sim-platform").value = report.browser.platform || "";
      field("sim-language").value = report.locale.language || "";
      field("sim-timezone").value = report.locale.timezone || "";
      field("sim-width").value = report.screen.width || "";
      field("sim-height").value = report.screen.height || "";
      field("sim-dpr").value = report.screen.devicePixelRatio || "";
      field("sim-cpu").value = report.hardware.hardwareConcurrency || "";
      field("sim-memory").value = report.hardware.deviceMemory || "";
      field("sim-touch").value = report.hardware.maxTouchPoints || 0;
      field("sim-webgl-vendor").value = report.webgl && report.webgl.vendor ? report.webgl.vendor : "";
      field("sim-webgl-renderer").value = report.webgl && report.webgl.renderer ? report.webgl.renderer : "";
    }

    function numberValue(id, fallback) {
      const value = Number(field(id).value);
      return Number.isFinite(value) ? value : fallback;
    }

    async function simulatedReportFromInputs() {
      const report = cloneReport(actualReport);
      report.mode = "local-simulation";
      report.note = "本报告只在本地测试页模拟参数，不会改变浏览器真实指纹或真实网站看到的值。";
      report.browser.userAgent = field("sim-ua").value;
      report.browser.appVersion = field("sim-ua").value.replace(/^Mozilla\//, "");
      report.browser.platform = field("sim-platform").value;
      report.locale.language = field("sim-language").value;
      report.locale.languages = field("sim-language").value ? [field("sim-language").value] : [];
      report.locale.timezone = field("sim-timezone").value;
      report.screen.width = numberValue("sim-width", report.screen.width);
      report.screen.height = numberValue("sim-height", report.screen.height);
      report.screen.availWidth = report.screen.width;
      report.screen.availHeight = report.screen.height;
      report.screen.devicePixelRatio = numberValue("sim-dpr", report.screen.devicePixelRatio);
      report.hardware.hardwareConcurrency = numberValue("sim-cpu", report.hardware.hardwareConcurrency);
      report.hardware.deviceMemory = numberValue("sim-memory", report.hardware.deviceMemory);
      report.hardware.maxTouchPoints = numberValue("sim-touch", report.hardware.maxTouchPoints);
      if (!report.webgl || !report.webgl.supported) {
        report.webgl = { supported: true };
      }
      report.webgl.vendor = field("sim-webgl-vendor").value;
      report.webgl.renderer = field("sim-webgl-renderer").value;
      report.generatedAt = new Date().toISOString();
      report.summaryHash = await sha256(JSON.stringify(report));
      return report;
    }

    function applyPreset(name) {
      if (name === "windows") {
        field("sim-ua").value = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36";
        field("sim-platform").value = "Win32";
        field("sim-language").value = "en-US";
        field("sim-timezone").value = "America/Los_Angeles";
        field("sim-width").value = "1920";
        field("sim-height").value = "1080";
        field("sim-dpr").value = "1";
        field("sim-cpu").value = "8";
        field("sim-memory").value = "8";
        field("sim-touch").value = "0";
        field("sim-webgl-vendor").value = "Google Inc. (NVIDIA)";
        field("sim-webgl-renderer").value = "ANGLE (NVIDIA, NVIDIA GeForce, Direct3D11)";
      }
      if (name === "mac") {
        field("sim-ua").value = "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Safari/605.1.15";
        field("sim-platform").value = "MacIntel";
        field("sim-language").value = "en-US";
        field("sim-timezone").value = "America/Los_Angeles";
        field("sim-width").value = "1440";
        field("sim-height").value = "900";
        field("sim-dpr").value = "2";
        field("sim-cpu").value = "8";
        field("sim-memory").value = "8";
        field("sim-touch").value = "0";
        field("sim-webgl-vendor").value = "Apple Inc.";
        field("sim-webgl-renderer").value = "Apple GPU";
      }
    }

    function flatten(value) {
      if (value === null || value === undefined) return "";
      if (typeof value === "object") return JSON.stringify(value, null, 2);
      return String(value);
    }

    function render(report) {
      currentReport = report;
      document.getElementById("hash").textContent = report.summaryHash.slice(0, 24);
      document.getElementById("browser").textContent = report.browser.userAgent;
      document.getElementById("locale").textContent = `${report.locale.language} / ${report.locale.timezone}`;
      document.getElementById("screen").textContent = `${report.screen.width}x${report.screen.height} @ ${report.screen.devicePixelRatio}`;
      document.getElementById("json").textContent = JSON.stringify(report, null, 2);

      const rows = [
        ["User-Agent", report.browser.userAgent],
        ["Platform", report.browser.platform],
        ["Vendor", report.browser.vendor],
        ["WebDriver", report.browser.webdriver],
        ["Languages", report.locale.languages],
        ["Timezone", report.locale.timezone],
        ["Screen", report.screen],
        ["Hardware", report.hardware],
        ["Storage", report.storage],
        ["Connection", report.connection],
        ["Canvas Hash", report.canvasHash],
        ["Audio Hash", report.audioHash],
        ["WebGL", report.webgl]
      ];
      document.getElementById("signals").innerHTML = rows.map(([key, value]) =>
        `<tr><th>${key}</th><td><pre>${escapeHtml(flatten(value))}</pre></td></tr>`
      ).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function refresh() {
      document.getElementById("json").textContent = "检测中...";
      actualReport = await collectReport();
      setSimulationInputs(actualReport);
      render(actualReport);
    }

    document.getElementById("refresh").addEventListener("click", refresh);
    document.getElementById("toggle-sim").addEventListener("click", () => {
      const panel = field("simulation");
      panel.classList.toggle("hidden");
      const open = !panel.classList.contains("hidden");
      field("toggle-sim").textContent = open ? "关闭模拟面板" : "打开模拟面板";
      if (open && actualReport.browser) setSimulationInputs(actualReport);
    });
    document.getElementById("apply-sim").addEventListener("click", async () => {
      render(await simulatedReportFromInputs());
    });
    document.getElementById("reset-sim").addEventListener("click", () => {
      setSimulationInputs(actualReport);
      render(actualReport);
    });
    document.getElementById("preset-win").addEventListener("click", async () => {
      applyPreset("windows");
      render(await simulatedReportFromInputs());
    });
    document.getElementById("preset-mac").addEventListener("click", async () => {
      applyPreset("mac");
      render(await simulatedReportFromInputs());
    });
    document.getElementById("copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText(JSON.stringify(currentReport, null, 2));
    });
    document.getElementById("download").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(currentReport, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `fingerprint-report-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    refresh().then(() => {
      const openSimulation =
        new URLSearchParams(location.search).get("simulate") === "1" ||
        location.hash.replace(/^#/, "") === "simulate";
      if (openSimulation) {
        field("simulation").classList.remove("hidden");
        field("toggle-sim").textContent = "关闭模拟面板";
      }
    });
  </script>
</body>
</html>
